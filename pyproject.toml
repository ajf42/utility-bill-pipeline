[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "utility-bill-pipeline"
version = "0.1.0"
description = "AI-augmented utility bill ingestion and quality assurance pipeline (prototype)."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Andrew Fitzpatrick" }]
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.110",
    "pydantic>=2.6",
    "anthropic>=0.34",
    "pandas>=2.2",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not integration'"
markers = [
    "integration: tests that call the real Anthropic API; require ANTHROPIC_API_KEY and are excluded by default. Run with `pytest -m integration` to opt in.",
]
